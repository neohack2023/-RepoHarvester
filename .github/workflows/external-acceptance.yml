name: External Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pcm-checkpoint-1:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RepoHarvester
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run pinned PCM acceptance gate
        run: |
          python scripts/run_external_acceptance.py \
            --repository-url https://github.com/anthonylee991/pcm.git \
            --revision 5dfb7ecca889dd8c12b8d088a1cbf91e4f8d1cf8 \
            --slug anthonylee991/pcm \
            --output-dir acceptance/pcm-checkpoint-1

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pcm-checkpoint-1-evidence
          path: acceptance/pcm-checkpoint-1/
          if-no-files-found: error
