name: Provider Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-provider-probes:
    name: external Git hosts
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,server]"

      - name: Probe external Git providers
        run: |
          mkdir -p test-results
          pytest -m live_network tests/query_parser/test_git_host_agnostic.py \
            --junitxml=test-results/provider-live-smoke.xml

      - name: Upload provider probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provider-live-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/provider-live-smoke.xml
          if-no-files-found: error
          retention-days: 30
