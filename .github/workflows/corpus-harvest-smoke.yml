name: Corpus Harvest Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-corpus:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RepoHarvester
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Harvest backoff baseline into shared corpus
        run: |
          python scripts/run_corpus_harvest.py \
            https://github.com/nradawg/backoff-schedule.git \
            --revision f4ed89aca0618c169ed68ccb2a261df8b971f415 \
            --database acceptance/corpus/harvest.sqlite3 \
            --output-dir acceptance/corpus/backoff-schedule

      - name: Harvest frontend clean architecture calibration target
        run: |
          python scripts/run_corpus_harvest.py \
            https://github.com/bespoyasov/frontend-clean-architecture.git \
            --revision f9ee6d94eef336dd77eb23b9344094c71bbfe47b \
            --database acceptance/corpus/harvest.sqlite3 \
            --output-dir acceptance/corpus/frontend-clean-architecture

      - name: Verify shared corpus coexistence and RAW state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from repoharvester.storage import SQLiteHarvestStore

          db = Path("acceptance/corpus/harvest.sqlite3")
          store = SQLiteHarvestStore(db)
          targets = [
              ("https://github.com/nradawg/backoff-schedule.git", "f4ed89aca0618c169ed68ccb2a261df8b971f415"),
              ("https://github.com/bespoyasov/frontend-clean-architecture.git", "f9ee6d94eef336dd77eb23b9344094c71bbfe47b"),
          ]
          for repo, revision in targets:
              records = store.query_records(source_repository=repo, source_revision=revision)
              relationships = store.query_relationships(source_repository=repo, source_revision=revision)
              states = sorted({record.qualification_state.value for record in records})
              print(json.dumps({
                  "repository": repo,
                  "revision": revision,
                  "records": len(records),
                  "relationships": len(relationships),
                  "qualification_states": states,
              }, sort_keys=True))
              assert records
              assert states == ["RAW"]
          for name in ("backoff-schedule", "frontend-clean-architecture"):
              summary = json.loads(Path(f"acceptance/corpus/{name}/HARVEST_SUMMARY.json").read_text())
              print(json.dumps({"summary": name, **summary}, sort_keys=True))
              assert summary["receipt_verified"] is True
              assert summary["source_worktree_clean"] is True
          PY

      - name: Upload corpus evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-clean-architecture-calibration-evidence
          path: acceptance/corpus/
          if-no-files-found: error
