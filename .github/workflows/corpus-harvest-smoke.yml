name: Corpus Harvest Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repository_url:
        description: Git clone URL to harvest
        required: true
        default: https://github.com/baranwang/stremio-addon-douban.git
        type: string
      revision:
        description: Exact commit SHA or remote ref; leave blank to resolve remote HEAD
        required: false
        default: 35b2633a9e4af7bc3ac2f0ac747e9cec5e8719f8
        type: string
      output_slug:
        description: Directory/artifact-safe slug for this harvest
        required: true
        default: stremio-alias-feature
        type: string

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    env:
      REPOSITORY_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.repository_url || 'https://github.com/baranwang/stremio-addon-douban.git' }}
      REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || '35b2633a9e4af7bc3ac2f0ac747e9cec5e8719f8' }}
      OUTPUT_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.output_slug || 'stremio-alias-feature' }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RepoHarvester
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Harvest repository into shared corpus
        shell: bash
        run: |
          args=(
            "$REPOSITORY_URL"
            --database acceptance/corpus/harvest.sqlite3
            --output-dir "acceptance/corpus/$OUTPUT_SLUG"
          )
          if [[ -n "$REVISION" ]]; then
            args+=(--revision "$REVISION")
          fi
          python scripts/run_corpus_harvest.py "${args[@]}"

      - name: Upload corpus evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.OUTPUT_SLUG }}-corpus-evidence
          path: acceptance/corpus/
          if-no-files-found: error
