name: Corpus Harvest Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backoff-schedule:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RepoHarvester
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Harvest pinned external repository into shared corpus
        run: |
          python scripts/run_corpus_harvest.py \
            https://github.com/nradawg/backoff-schedule.git \
            --revision f4ed89aca0618c169ed68ccb2a261df8b971f415 \
            --database acceptance/corpus/harvest.sqlite3 \
            --output-dir acceptance/corpus/backoff-schedule

      - name: Upload corpus evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backoff-schedule-corpus-evidence
          path: acceptance/corpus/
          if-no-files-found: error
