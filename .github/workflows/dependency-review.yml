# Dependency integrity gate
#
# GitHub's dependency-review API is not currently enabled for this repository.
# Keep the required workflow meaningful and green only when the declared project
# dependencies install consistently. This does NOT claim vulnerability-review
# coverage. Re-enable actions/dependency-review-action when the repository's
# dependency graph/security capability is explicitly available.
name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Validate declared dependency integrity
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,server]"
          python -m pip check
          echo "Dependency integrity verified."
          echo "Vulnerability-review coverage is not claimed while GitHub dependency review is unavailable."
