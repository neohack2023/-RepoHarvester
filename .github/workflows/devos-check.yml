name: DevOS checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  devos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate_devos.py
      - run: python tools/build_knowledge_db.py --check
