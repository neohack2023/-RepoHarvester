name: DevOS Live Adoption

on:
  pull_request:
  push:
    branches: [main, "devos/**"]

permissions:
  contents: read

jobs:
  devos-live-adoption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate RepoHarvester DevOS
        run: python tools/validate_devos.py
      - name: Validate existing knowledge runtime
        run: python tools/build_knowledge_db.py --check
      - name: Validate portable v0.12 adoption bridge
        run: python tools/devos_live_adoption.py
      - name: Run existing DevOS runtime tests
        run: python -m unittest tests.test_devos_runtime -v
